<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="parent">
    <div class="titlebox">
       <h1>Create your profile</h1> 
    </div>
    <div class="inputs">
        <form method="post">
            {% csrf_token %}
       <div class="radiobu">
        <h4>Male<input name="radioone" type="radio"/></h4>
        <h4>Female<input name="radiotwo" type="radio"/></h4>
       </div>
       <div class="oth">
        <h4 class="hi">Upload your photo</h4><input name="photo" type="file"/>
       </div>
       <div class="in">
        <h4 class="hi">Name</h4>
        <input class="o" name="username" placeholder="Enter your name" type="text"/>
        <h4 class="hi">Mobile number</h4>
        <input class="o" name="phnumber" placeholder="Enter your phone number" type="number"/>
        <h4 class="hi">Address</h4>
        <input class="o" name="address" placeholder="Enter your address" type="text"/>
        <h4 class="hi">Postal code</h4>
        <input class="o" name="postcode" placeholder="Enter your postal code" type="text"/>
        <button type="submit">Create</button>
        </form>
       </div> 
    </div>
    </div>
</body>
